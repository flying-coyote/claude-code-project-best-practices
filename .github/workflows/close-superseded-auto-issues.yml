name: Close Superseded Auto-Filed Issues

# One-shot maintenance, run manually. Not scheduled — it exists to drain a
# backlog once, not to run forever.
#
# WHY THIS EXISTS
# ---------------
# This repository accumulated ~972 open issues, none of them triaged. Two
# generators produced them:
#
#   1. The daily source/documentation watchers (📋 Daily source review,
#      📊 Documentation maintenance, 🔍 Review awesome-claude-code updates,
#      📚 Review potential new Anthropic blog post, 📚 Review Claude Code
#      vX release). These generators were DELETED in the 2026-07 Reduction
#      Phase 6, explicitly because "their GitHub issues sat unread — hundreds
#      open, zero triage". The generators are gone; their output was left.
#      Nothing has filed one since 2026-07-10.
#
#   2. The link checker, which filed a fresh "🔗 Broken links detected" issue
#      on every scheduled run rather than updating one. It survived that cull
#      and reproduced the same failure. It was rewritten on 2026-08-28 to
#      maintain a single standing issue and to fail the PR on a new dangling
#      internal link — and the corpus it was reporting on now has ZERO dangling
#      internal links, so every one of its historical reports is spent.
#
# An untriaged backlog this size is not a record, it is noise that hides the
# signal — the same pathology the repo documents in
# analysis/prose-corpus-discoverability.md: a check that fires into a void is,
# in outcome, no check at all.
#
# SAFETY
# ------
# - Closes ONLY issues whose titles match the known auto-generated patterns.
# - Never touches an issue with any comment on it (a comment means a human
#   engaged, so it is not untriaged noise).
# - Never touches pull requests.
# - Dry-run by default. You must pass apply=true to actually close anything.
# - Closes as `not_planned`, which is the honest reason: these were never
#   planned work, they were unread machine output.
#
# RATE LIMITS — why this runs in batches
# --------------------------------------
# Measured 2026-08-29 on the first dry run: 935 open issues, 878 matching.
# Closing one issue costs 2 API calls (comment + close), and the comment is a
# "content-generating" request. GITHUB_TOKEN in Actions is limited to roughly
# 1,000 requests/hour per repo, with a secondary limit near 80 content-generating
# requests/minute and 500/hour.
#
# The first version of this loop fired all of them back-to-back with retries:0.
# At 878 matches that bursts straight through the per-minute ceiling, throws a
# 403, and fails the job mid-drain with no record of how far it got. So:
#
#   - `delay_ms` paces the loop (default 1000ms = 60/min, under the 80/min cap).
#   - `limit` defaults to 250, which fits inside one hour's content budget.
#   - A rate-limit error STOPS the run cleanly and reports the count instead of
#     throwing. Progress is never lost.
#   - The job is IDEMPOTENT and meant to be re-run: each run re-scans and only
#     sees issues that are still open. Repeat until a dry run reports 0 matched.
#   - `comment: false` skips the explanation, halving the calls and removing the
#     content-generating limit entirely — one pass drains everything. Prefer
#     leaving it true: an unexplained mass-close is the same opaque machine
#     output this cleanup exists to undo.

on:
  workflow_dispatch:
    inputs:
      # A `string` input renders as a text box pre-filled with its default, which
      # is easy to walk straight past — this shipped as apply/'false' and produced
      # THREE consecutive accidental dry runs before anyone noticed the field.
      # `type: choice` renders a dropdown whose options say what they do, so the
      # destructive mode has to be chosen on purpose rather than merely not-skipped.
      apply:
        description: 'Mode — pick APPLY to actually close issues'
        required: true
        type: choice
        default: 'dry-run (list only, closes nothing)'
        options:
          - 'dry-run (list only, closes nothing)'
          - 'APPLY - actually close the matched issues'
      limit:
        description: 'Max issues to close in this run (keep <=250 while commenting; see RATE LIMITS in the header)'
        required: true
        default: '250'
      comment:
        description: 'Post the explanatory comment before closing (false = close silently, ~2x faster, no explanation left behind)'
        required: true
        default: 'true'
      delay_ms:
        description: 'Pause between issues, milliseconds. Throttles under the secondary rate limit.'
        required: true
        default: '1000'

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        # Inputs are passed BOTH ways on purpose. `inputs.*` is the documented
        # context for workflow_dispatch; `context.payload.inputs` is what the
        # script originally read. Five consecutive runs came out as dry runs with
        # no way to tell from the logs whether the operator left the dropdown
        # alone or the value never arrived — so now the script reads whichever is
        # populated and LOGS BOTH. An input you cannot observe is an input you
        # cannot debug.
        env:
          APPLY_INPUT: ${{ inputs.apply }}
          LIMIT_INPUT: ${{ inputs.limit }}
          COMMENT_INPUT: ${{ inputs.comment }}
          DELAY_INPUT: ${{ inputs.delay_ms }}
        with:
          script: |
            const payload = context.payload.inputs || {};
            const pick = (envName, key) => {
              const fromEnv = process.env[envName];
              const fromPayload = payload[key];
              const value = (fromEnv != null && fromEnv !== '') ? fromEnv : fromPayload;
              return { value, fromEnv, fromPayload };
            };

            const a = pick('APPLY_INPUT', 'apply');
            core.info(
              `input apply -> inputs context: ${JSON.stringify(a.fromEnv ?? null)}; ` +
              `event payload: ${JSON.stringify(a.fromPayload ?? null)}`
            );

            // Matching is deliberately narrow. A prefix test like /^apply/i looks
            // friendlier but reads "apply=false" as APPLY — the one direction that
            // must never misfire. The two accepted prefixes below cover the dropdown
            // option (with whitespace/case drift) without ever matching "apply=false".
            const rawApply = String(a.value ?? '').trim().toLowerCase();
            const APPLY = rawApply.startsWith('apply -') || rawApply.startsWith('apply-')
                       || rawApply === 'true' || rawApply === 'apply';
            core.info(`resolved mode: ${APPLY ? 'APPLY (will close issues)' : 'DRY RUN (closes nothing)'}`);

            const LIMIT = parseInt(pick('LIMIT_INPUT', 'limit').value || '250', 10);
            const COMMENT = String(pick('COMMENT_INPUT', 'comment').value ?? 'true') !== 'false';
            const DELAY_MS = parseInt(pick('DELAY_INPUT', 'delay_ms').value || '1000', 10);

            // Titles produced by generators that no longer exist, plus the
            // superseded link-checker stream. Anchored to the start of the
            // title so a human-written issue mentioning these words is safe.
            const PATTERNS = [
              /^🔗 Broken links detected in documentation$/,
              /^📋 Daily source review/,
              /^📊 Documentation maintenance/,
              /^🔍 Review awesome-claude-code updates$/,
              /^📚 Review potential new Anthropic blog post$/,
              /^📚 Review Claude Code .* release$/,
              /^📋 Weekly source review/,
              /^✅ Self-compliance audit/,
              /^🚨 CRITICAL: Tier A sources inaccessible$/,
            ];
            // The standing issue the rewritten checker maintains — never close it.
            const KEEP = /^🔗 Standing report: broken links in documentation$/;

            const closeNote = [
              'Closing as **superseded machine output**, not as completed work.',
              '',
              'This issue was filed automatically by a generator that no longer exists,',
              'or by the link checker before it was rewritten. Specifics:',
              '',
              '- The daily source/documentation watchers were **deleted** in the 2026-07',
              '  Reduction (Phase 6), explicitly because their issues sat unread.',
              '- The link checker was **rewritten on 2026-08-28** to maintain one standing',
              '  issue instead of filing daily, and to fail a PR on a new dangling internal',
              '  link. The corpus it reported on now has **zero** dangling internal links.',
              '',
              'Nothing here was triaged and nothing in it is actionable today. If a real',
              'task is buried in this issue, reopen it — that is the signal this cleanup',
              'is meant to make visible again.',
              '',
              'See `analysis/prose-corpus-discoverability.md` — a check that fires into a',
              'void is, in outcome, no check at all.',
            ].join('\n');

            let closed = 0, skippedCommented = 0, scanned = 0, page = 1;
            const toClose = [];

            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100, page,
              });
              if (!data.length) break;
              for (const issue of data) {
                if (issue.pull_request) continue;
                scanned++;
                if (KEEP.test(issue.title)) continue;
                if (!PATTERNS.some(p => p.test(issue.title))) continue;
                if (issue.comments > 0) { skippedCommented++; continue; }
                toClose.push(issue.number);
              }
              page++;
              if (page > 30) break;
            }

            core.info(`scanned ${scanned} open issues`);
            core.info(`matched ${toClose.length} auto-filed, untriaged issues`);
            core.info(`skipped ${skippedCommented} that carry a human comment`);

            if (!APPLY) {
              const thisRun = Math.min(toClose.length, LIMIT);
              const runsNeeded = toClose.length ? Math.ceil(toClose.length / LIMIT) : 0;
              core.notice(
                `DRY RUN — nothing was closed. ${toClose.length} match; this run would close ${thisRun} ` +
                `(limit=${LIMIT}), so ~${runsNeeded} run(s) to drain. ` +
                `To actually close them: Run workflow → set Mode to ` +
                `"APPLY - actually close the matched issues".`
              );
              core.info(toClose.slice(0, 50).join(', ') + (toClose.length > 50 ? ' …' : ''));
              return;
            }

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const isRateLimit = e => {
              const s = e && e.status;
              const m = String((e && e.message) || '');
              return s === 429 || (s === 403 && /rate limit|abuse|secondary/i.test(m));
            };

            const batch = toClose.slice(0, LIMIT);
            let stoppedEarly = false;

            for (const number of batch) {
              try {
                if (COMMENT) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: number, body: closeNote,
                  });
                }
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: number, state: 'closed', state_reason: 'not_planned',
                });
                closed++;
                if (closed % 25 === 0) core.info(`closed ${closed}…`);
              } catch (e) {
                if (isRateLimit(e)) {
                  // Stop cleanly rather than throwing. Everything closed so far
                  // stays closed, and the next run re-scans and picks up the rest.
                  core.warning(`Rate limit hit after ${closed} closes (issue #${number}): ${e.message}`);
                  stoppedEarly = true;
                  break;
                }
                core.warning(`Skipped #${number}: ${e.message}`);
              }
              if (DELAY_MS > 0) await sleep(DELAY_MS);
            }

            const remaining = toClose.length - closed;
            core.notice(
              `Closed ${closed} superseded auto-filed issues.` +
              (remaining > 0
                ? ` ${remaining} still match and are untouched — re-run this workflow to continue` +
                  (stoppedEarly ? ' (stopped early on a rate limit; wait ~an hour).' : '.')
                : ' Nothing left matching — the backlog is drained.')
            );
