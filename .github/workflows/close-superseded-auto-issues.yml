name: Close Superseded Auto-Filed Issues

# One-shot maintenance, run manually. Not scheduled — it exists to drain a
# backlog once, not to run forever.
#
# WHY THIS EXISTS
# ---------------
# This repository accumulated ~972 open issues, none of them triaged. FOUR
# generators produced them (this said "Two" until 2026-08-29, and the two it
# omitted turned out to be 55 of the 61 issues still open — the undercount here
# and the matching gap in PATTERNS were the same mistake written twice):
#
#   1. The daily source/documentation watchers (📋 Daily source review,
#      📊 Documentation maintenance, 🔍 Review awesome-claude-code updates,
#      📚 Review potential new Anthropic blog post, 📚 Review Claude Code
#      vX release). These generators were DELETED in the 2026-07 Reduction
#      Phase 6, explicitly because "their GitHub issues sat unread — hundreds
#      open, zero triage". The generators are gone; their output was left.
#      Nothing has filed one since 2026-07-10.
#
#   1b. The community-engagement watcher (🤝 Community engagement triage),
#      also from source-monitoring.yml and also deleted in d9e484d. 49 of its
#      issues are still open — the single largest family in the backlog, and one
#      no pattern matched until 2026-08-29.
#
#   1c. The measurement-expiry watcher (⚠️ Expired Measurement Claims Detected),
#      filed by tools-evolution-tracker.yml, deleted in 4875ed5. 6 still open.
#      Its successor, scripts/check-measurement-expiry.py, now runs in CI as a
#      failing check instead of filing issues — precisely because this is what
#      filing them produced.
#
#   2. The link checker, which filed a fresh "🔗 Broken links detected" issue
#      on every scheduled run rather than updating one. It survived that cull
#      and reproduced the same failure. It was rewritten on 2026-08-28 to
#      maintain a single standing issue and to fail the PR on a new dangling
#      internal link — and the corpus it was reporting on now has ZERO dangling
#      internal links, so every one of its historical reports is spent.
#
# An untriaged backlog this size is not a record, it is noise that hides the
# signal — the same pathology the repo documents in
# analysis/prose-corpus-discoverability.md: a check that fires into a void is,
# in outcome, no check at all.
#
# SAFETY
# ------
# - Closes ONLY issues whose titles match the known auto-generated patterns.
# - Never touches an issue with any comment on it (a comment means a human
#   engaged, so it is not untriaged noise).
# - Never touches pull requests.
# - Dry-run by default. You must pass apply=true to actually close anything.
# - Closes as `not_planned`, which is the honest reason: these were never
#   planned work, they were unread machine output.
#
# RATE LIMITS — why this runs in batches
# --------------------------------------
# Measured 2026-08-29 on the first dry run: 935 open issues, 878 matching.
# Closing one issue costs 2 API calls (comment + close), and the comment is a
# "content-generating" request. GITHUB_TOKEN in Actions is limited to roughly
# 1,000 requests/hour per repo, with a secondary limit near 80 content-generating
# requests/minute and 500/hour.
#
# The first version of this loop fired all of them back-to-back with retries:0.
# At 878 matches that bursts straight through the per-minute ceiling, throws a
# 403, and fails the job mid-drain with no record of how far it got. So:
#
#   - `delay_ms` paces the loop (default 1000ms = 60/min, under the 80/min cap).
#   - `limit` defaults to 250, which fits inside one hour's content budget.
#   - A rate-limit error STOPS the run cleanly and reports the count instead of
#     throwing. Progress is never lost.
#   - The job is IDEMPOTENT and meant to be re-run: each run re-scans and only
#     sees issues that are still open. Repeat until a dry run reports 0 matched.
#   - `comment: false` skips the explanation, halving the calls and removing the
#     content-generating limit entirely — one pass drains everything. Prefer
#     leaving it true: an unexplained mass-close is the same opaque machine
#     output this cleanup exists to undo.

on:
  workflow_dispatch:
    inputs:
      # A `string` input renders as a text box pre-filled with its default, which
      # is easy to walk straight past — this shipped as apply/'false' and produced
      # THREE consecutive accidental dry runs before anyone noticed the field.
      # `type: choice` renders a dropdown whose options say what they do, so the
      # destructive mode has to be chosen on purpose rather than merely not-skipped.
      apply:
        description: 'Mode — pick APPLY to actually close issues'
        required: true
        type: choice
        default: 'dry-run (list only, closes nothing)'
        options:
          - 'dry-run (list only, closes nothing)'
          - 'APPLY - actually close the matched issues'
      limit:
        description: 'Max issues to close in this run (keep <=250 while commenting; see RATE LIMITS in the header)'
        required: true
        default: '250'
      comment:
        description: 'Post the explanatory comment before closing (false = close silently, ~2x faster, no explanation left behind)'
        required: true
        default: 'true'
      delay_ms:
        description: 'Pause between issues, milliseconds. Throttles under the secondary rate limit.'
        required: true
        default: '1000'

permissions:
  issues: write

# Runs 8 and 9 on 2026-08-29 OVERLAPPED (02:39:26-02:43:05). Two drains at once
# double the content-creation rate, which is the one thing `delay_ms` exists to
# hold down — the throttle is per-run, so concurrency silently defeats it. That
# overlap cost 25 issues (see the 422 handling below). Queue instead of cancel:
# a half-finished drain should complete, not be killed.
concurrency:
  group: close-superseded-auto-issues
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        # Inputs are passed BOTH ways on purpose. `inputs.*` is the documented
        # context for workflow_dispatch; `context.payload.inputs` is what the
        # script originally read. Five consecutive runs came out as dry runs with
        # no way to tell from the logs whether the operator left the dropdown
        # alone or the value never arrived — so now the script reads whichever is
        # populated and LOGS BOTH. An input you cannot observe is an input you
        # cannot debug.
        env:
          APPLY_INPUT: ${{ inputs.apply }}
          LIMIT_INPUT: ${{ inputs.limit }}
          COMMENT_INPUT: ${{ inputs.comment }}
          DELAY_INPUT: ${{ inputs.delay_ms }}
        with:
          script: |
            const payload = context.payload.inputs || {};
            const pick = (envName, key) => {
              const fromEnv = process.env[envName];
              const fromPayload = payload[key];
              const value = (fromEnv != null && fromEnv !== '') ? fromEnv : fromPayload;
              return { value, fromEnv, fromPayload };
            };

            const a = pick('APPLY_INPUT', 'apply');
            core.info(
              `input apply -> inputs context: ${JSON.stringify(a.fromEnv ?? null)}; ` +
              `event payload: ${JSON.stringify(a.fromPayload ?? null)}`
            );

            // Matching is deliberately narrow. A prefix test like /^apply/i looks
            // friendlier but reads "apply=false" as APPLY — the one direction that
            // must never misfire. The two accepted prefixes below cover the dropdown
            // option (with whitespace/case drift) without ever matching "apply=false".
            const rawApply = String(a.value ?? '').trim().toLowerCase();
            const APPLY = rawApply.startsWith('apply -') || rawApply.startsWith('apply-')
                       || rawApply === 'true' || rawApply === 'apply';
            core.info(`resolved mode: ${APPLY ? 'APPLY (will close issues)' : 'DRY RUN (closes nothing)'}`);

            const LIMIT = parseInt(pick('LIMIT_INPUT', 'limit').value || '250', 10);
            const COMMENT = String(pick('COMMENT_INPUT', 'comment').value ?? 'true') !== 'false';
            const DELAY_MS = parseInt(pick('DELAY_INPUT', 'delay_ms').value || '1000', 10);

            // Titles produced by generators that no longer exist, plus the
            // superseded link-checker stream. Anchored to the start of the
            // title so a human-written issue mentioning these words is safe.
            const PATTERNS = [
              /^🔗 Broken links detected in documentation$/,
              /^📋 Daily source review/,
              /^📊 Documentation maintenance/,
              /^🔍 Review awesome-claude-code updates$/,
              /^📚 Review potential new Anthropic blog post$/,
              /^📚 Review Claude Code .* release$/,
              /^📋 Weekly source review/,
              /^✅ Self-compliance audit/,
              /^🚨 CRITICAL: Tier A sources inaccessible$/,
              // Added 2026-08-29. These two families are 55 of the 61 issues the
              // REST listing returns, and NO pattern above matched either, so the
              // drain scanned the backlog, matched 0, and printed "Nothing left
              // matching — the backlog is drained" while ~55 issues sat open. A
              // firing check that cannot see its own subject, inside the
              // instrument written to cure exactly that.
              //
              // Both are machine output, verified by fetching them: user
              // github-actions[bot], bodies ending "Automatically created by
              // source-monitoring workflow" and "Generated by:
              // scripts/check-measurement-expiry.py". PLAN and
              // .github/workflows/README.md called this residue "human issues
              // untouched" — it is not human, and that mislabel is corrected with
              // this change.
              //
              // Their feeders are both already deleted: source-monitoring.yml in
              // d9e484d and tools-evolution-tracker.yml in 4875ed5. Nothing
              // refills these families, so this is a one-time drain, not a
              // recurring suppression.
              //
              // The warning sign is U+26A0 U+FE0F — U+26A0 plus the VARIATION
              // SELECTOR. Verified against the real title from the API, not a
              // reconstruction: a pattern carrying a bare U+26A0 silently matches
              // nothing.
              /^🤝 Community engagement triage/,
              /^⚠️ Expired Measurement Claims Detected$/,
            ];
            // The standing issue the rewritten checker maintains — never close it.
            const KEEP = /^🔗 Standing report: broken links in documentation$/;

            const closeNote = [
              'Closing as **superseded machine output**, not as completed work.',
              '',
              'This issue was filed automatically by a generator that no longer exists,',
              'or by the link checker before it was rewritten. Specifics:',
              '',
              '- The daily source/documentation watchers were **deleted** in the 2026-07',
              '  Reduction (Phase 6), explicitly because their issues sat unread.',
              '- The link checker was **rewritten on 2026-08-28** to maintain one standing',
              '  issue instead of filing daily, and to fail a PR on a new dangling internal',
              '  link. The corpus it reported on now has **zero** dangling internal links.',
              '',
              'Nothing here was triaged and nothing in it is actionable today. If a real',
              'task is buried in this issue, reopen it — that is the signal this cleanup',
              'is meant to make visible again.',
              '',
              'See `analysis/prose-corpus-discoverability.md` — a check that fires into a',
              'void is, in outcome, no check at all.',
            ].join('\n');

            let closed = 0, skippedCommented = 0, scanned = 0, page = 1;
            // unmatched: open non-PR issues that no PATTERN claims and that are
            // not the standing issue. Counted so the completion message can be
            // RECONCILED against the repo instead of only against itself — see
            // the notice at the end. Without this the drain reported "the
            // backlog is drained" on a run where it matched 0 of 61, because
            // remaining (matched - closed) was 0 and nothing ever asked how many
            // issues were still open.
            let unmatched = 0, keptStanding = 0;
            const toClose = [];

            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100, page,
              });
              if (!data.length) break;
              for (const issue of data) {
                if (issue.pull_request) continue;
                scanned++;
                if (KEEP.test(issue.title)) { keptStanding++; continue; }
                if (!PATTERNS.some(p => p.test(issue.title))) { unmatched++; continue; }
                if (issue.comments > 0) { skippedCommented++; continue; }
                toClose.push(issue.number);
              }
              page++;
              if (page > 30) break;
            }

            core.info(`scanned ${scanned} open issues`);
            core.info(`matched ${toClose.length} auto-filed, untriaged issues`);
            core.info(`skipped ${skippedCommented} that carry a human comment`);
            core.info(`unmatched by any pattern: ${unmatched} (standing issue kept: ${keptStanding})`);

            // INDEPENDENT COMPLETENESS CHECK — added 2026-08-31.
            //
            // Everything above is derived from ONE listing. `unmatched` reconciles
            // matched-against-scanned, which is only meaningful if `scanned` is the
            // whole repo. It is not always: on 2026-08-31 run 13 scanned 56 of 61
            // open issues and run 14 scanned 1 of 6, missing the SAME five both
            // times (#689, #683, #646, #561, #554 — all pattern-matching, all
            // comment-free, all untouched since May 2026). Both runs printed
            // "every open issue was accounted for — the backlog is drained".
            //
            // That is the same all-clear-that-cannot-see-its-subject pathology this
            // workflow exists to cure, one level below where 2026-08-29 fixed it:
            // when the listing under-returns, every internal count agrees with every
            // other and the reconciliation is vacuous.
            //
            // So reconcile against a DIFFERENT code path. repos.get() reports
            // open_issues_count (issues + PRs) from a separate endpoint; subtract the
            // open PRs and the remainder is how many open issues the repo believes it
            // has. If the listing returned fewer, it is incomplete and NOTHING below
            // may claim the backlog is drained.
            //
            // The cause of the shortfall is NOT established. This check does not
            // depend on knowing it — it only has to refuse to declare victory it
            // cannot verify.
            let expectedIssues = null, shortfall = 0;
            try {
              const { data: repoMeta } = await github.rest.repos.get({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              let openPRs = 0;
              for (let pp = 1; pp <= 30; pp++) {
                const { data } = await github.rest.pulls.list({
                  owner: context.repo.owner, repo: context.repo.repo,
                  state: 'open', per_page: 100, page: pp,
                });
                if (!data.length) break;
                openPRs += data.length;
              }
              expectedIssues = repoMeta.open_issues_count - openPRs;
              shortfall = expectedIssues - scanned;
              core.info(`repo reports ${expectedIssues} open issue(s) (${repoMeta.open_issues_count} incl. ${openPRs} PR(s)); listing returned ${scanned}`);
            } catch (e) {
              // Unverifiable is not the same as verified. Say so, and suppress the
              // all-clear either way.
              core.warning(`Could not verify listing completeness: ${e.status || '?'} ${e.message}`);
              expectedIssues = null;
            }
            if (expectedIssues !== null && shortfall > 0) {
              core.warning(
                `LISTING INCOMPLETE: the repository reports ${expectedIssues} open issue(s) but ` +
                `the issues listing returned only ${scanned}. ${shortfall} open issue(s) were never ` +
                `scanned, so they were neither matched nor closed. Do not treat this run as a drain.`);
            }

            if (!APPLY) {
              const thisRun = Math.min(toClose.length, LIMIT);
              const runsNeeded = toClose.length ? Math.ceil(toClose.length / LIMIT) : 0;
              core.notice(
                `DRY RUN — nothing was closed. ${toClose.length} match; this run would close ${thisRun} ` +
                `(limit=${LIMIT}), so ~${runsNeeded} run(s) to drain. ` +
                `To actually close them: Run workflow → set Mode to ` +
                `"APPLY - actually close the matched issues".`
              );
              core.info(toClose.slice(0, 50).join(', ') + (toClose.length > 50 ? ' …' : ''));
              return;
            }

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            // 422 belongs here. When the two concurrent runs on 2026-08-29 blew
            // through the content-creation cap, GitHub surfaced it as
            // "422 Validation Failed" — not 429, not 403 — so this predicate
            // missed it, the generic handler swallowed each error, and the loop
            // plowed on skipping 25 issues instead of stopping. Silently
            // continuing past a throttle signal is the fail-open shape again.
            const isRateLimit = e => {
              const s = e && e.status;
              const m = String((e && e.message) || '');
              return s === 429
                || s === 422
                || (s === 403 && /rate limit|abuse|secondary/i.test(m));
            };

            const batch = toClose.slice(0, LIMIT);
            let stopReason = null;   // 'rate-limit' | 'repeated-failures'
            let consecutiveFailures = 0;

            for (const number of batch) {
              try {
                if (COMMENT) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: number, body: closeNote,
                  });
                }
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: number, state: 'closed', state_reason: 'not_planned',
                });
                closed++;
                consecutiveFailures = 0;
                if (closed % 25 === 0) core.info(`closed ${closed}…`);
              } catch (e) {
                if (isRateLimit(e)) {
                  // Stop cleanly rather than throwing. Everything closed so far
                  // stays closed, and the next run re-scans and picks up the rest.
                  core.warning(`Rate limit hit after ${closed} closes (issue #${number}): ${e.status} ${e.message}`);
                  stopReason = 'rate-limit';
                  break;
                }
                consecutiveFailures++;
                core.warning(`Skipped #${number}: ${e.status || '?'} ${e.message}`);
                // Never grind through a systemic fault one issue at a time. If
                // several in a row fail, something is wrong with the run, not
                // with those particular issues.
                if (consecutiveFailures >= 5) {
                  core.warning(`Stopping after ${consecutiveFailures} consecutive failures.`);
                  stopReason = 'repeated-failures';
                  break;
                }
              }
              if (DELAY_MS > 0) await sleep(DELAY_MS);
            }

            const remaining = toClose.length - closed;
            core.notice(
              `Closed ${closed} superseded auto-filed issues.` +
              (remaining > 0
                ? ` ${remaining} still match and are untouched — re-run this workflow to continue` +
                  (stopReason === 'rate-limit'
                    ? ' (stopped early on a rate limit; wait ~an hour).'
                    : stopReason === 'repeated-failures'
                      ? ' (stopped early after repeated failures — check the warnings above before re-running).'
                      : '.')
                : (unmatched > 0
                    // RECONCILED, not merely subtracted. "remaining" only ever
                    // measured matched-minus-closed, so it hit 0 whenever the
                    // patterns saw nothing — and on 2026-08-29 this branch
                    // printed "the backlog is drained" against 61 open issues it
                    // had matched 0 of. An all-clear that cannot distinguish
                    // "nothing left" from "nothing seen" is the firing-check
                    // pathology this workflow exists to cure, occurring inside
                    // the cure.
                    // Report the reconciliation; do NOT assert a verdict this
                    // workflow cannot reach. It matches on titles, so it cannot
                    // tell a genuinely human issue from a generator family it
                    // has never heard of — both look like "unmatched". Naming
                    // the number and both readings is the honest output; the
                    // failure being cured is the message that mentioned neither.
                    ? ` ${unmatched} open issue(s) matched no pattern and were left alone. ` +
                      'That is the right outcome if they are human, and a missing generator ' +
                      'family in PATTERNS if they are not — this workflow matches on titles ' +
                      'and cannot tell the two apart. Read them before concluding the backlog ' +
                      'is drained.'
                    : (expectedIssues === null
                        ? ' Nothing left matching among the issues this run could see, but listing' +
                          ' completeness could NOT be verified (see the warning above) — this is not' +
                          ' an all-clear.'
                        : shortfall > 0
                          ? ` Nothing left matching among the ${scanned} issue(s) this run could see —` +
                            ` but the repository reports ${expectedIssues} open, so ${shortfall} were` +
                            ' never scanned. The backlog is NOT drained; re-run, and if the shortfall' +
                            ' persists the listing itself is dropping issues.'
                          : ' Nothing left matching, and every open issue was accounted for — the backlog is drained.')))
            );
