name: Link Checker

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering
  pull_request:
    paths:
      # Markdown, because that is what the link check reads.
      - '**.md'
      # ...and the machinery itself. Until 2026-08-29 this list was '**.md'
      # ALONE, which meant the `test-instruments` job — added specifically to
      # guard these files — never ran when any of them changed. PR #1002 edited
      # link-checker.yml and triggered NOTHING; #1001 only triggered because it
      # happened to touch PLAN.md as well. A guard that is deaf to changes in
      # the thing it guards is the same defect one layer out again.
      - '.github/workflows/link-checker.yml'
      - '.github/workflows/close-superseded-auto-issues.yml'
      - 'scripts/measure-link-reachability.py'
      - 'scripts/test-measure-link-reachability.py'
      - 'scripts/test-close-superseded-workflow.js'
      - 'scripts/check-measurement-expiry.py'
      - 'scripts/graphify_footer_inject.py'

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check links in markdown files
        id: link-check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/link-check-config.json'
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
        continue-on-error: true

      - name: Get link check results
        if: steps.link-check.outcome == 'failure'
        id: results
        run: |
          echo "has_broken_links=true" >> $GITHUB_OUTPUT

      # Internal links are the actionable half and are checked deterministically
      # by the repo's own instrument. External link rot is mostly not this repo's
      # to fix, and conflating the two is what produced 916 untriaged issues.
      # FAILS OPEN NO LONGER. This step used to end the instrument call with
      # `|| true` and default a missing count to 0 — so a renamed script, an
      # import error, or a mid-run traceback produced `dangling_live=0` and the
      # gate below reported PASS. Both crash paths were reproduced 2026-08-29.
      # `|| true` was not even load-bearing for the happy path: the instrument
      # has no sys.exit of its own, so it only ever swallowed crashes.
      #
      # A check that reports "clean" when its instrument is broken is worse than
      # no check, because it manufactures the evidence that nothing is wrong.
      - name: Check internal links (deterministic, actionable)
        id: internal
        run: |
          set -euo pipefail
          python3 scripts/measure-link-reachability.py --links > /tmp/links.txt
          cat /tmp/links.txt
          # No `END{exit !found}` here: under `set -e` a non-zero awk would abort
          # the step before the check below could explain why, which made the
          # error message dead code for the exact case it was written for.
          # Plain awk exits 0 on no-match, leaving DANGLING empty, and the regex
          # below rejects it *with* the message. Same safety, better diagnosis.
          DANGLING=$(awk '/^dangling/{print $2}' /tmp/links.txt)
          if ! [[ "$DANGLING" =~ ^[0-9]+$ ]]; then
            echo "::error::instrument produced no parseable 'dangling' row (got: '${DANGLING}') — refusing to report a count."
            exit 1
          fi
          echo "dangling_live=${DANGLING}" >> "$GITHUB_OUTPUT"

      - name: Fail the PR on a NEW broken internal link
        if: github.event_name == 'pull_request' && steps.internal.outputs.dangling_live != '0'
        run: |
          echo "::error::${{ steps.internal.outputs.dangling_live }} dangling internal link(s) in the live lane."
          echo "Run: python3 scripts/measure-link-reachability.py --links"
          exit 1

      # ONE standing issue, updated in place. The previous version filed a fresh
      # issue every scheduled run: 916 open, zero comments, none ever triaged,
      # while 214 links stayed broken. A firing check that nobody can act on is,
      # in outcome, no check at all -- and this repo already deleted its RSS
      # watchers for exactly that failure (Reduction Phase 6). Re-filing daily is
      # what made it unactionable, so it now updates a single issue and closes it
      # when the corpus goes clean.
      - name: Update the standing broken-links issue
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '🔗 Standing report: broken links in documentation';
            const failed = '${{ steps.link-check.outcome }}' === 'failure';
            const dangling = '${{ steps.internal.outputs.dangling_live }}';
            const run = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            const found = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'documentation', per_page: 100,
            });
            const existing = found.data.find(i => i.title === TITLE);

            if (!failed && dangling === '0') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All links clean as of ${new Date().toISOString().slice(0,10)}. Closing; this issue reopens automatically if links break again.\n\n${run}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              '**This is a standing issue, updated in place — not re-filed daily.**',
              '',
              `- Dangling **internal** links in the live lane: **${dangling}** ← actionable, fix these`,
              `- External link check: **${failed ? 'failures present' : 'clean'}** ← mostly upstream rot, triage by exception`,
              '',
              '```',
              'python3 scripts/measure-link-reachability.py --links   # internal, deterministic',
              '```',
              '',
              'For external failures: update the URL, cite an Internet Archive snapshot, or mark the',
              'source ⚠️ Stale in SOURCES.md and consider the evidence-tier implication.',
              '',
              `Last checked: ${new Date().toISOString()} — ${run}`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body, state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, labels: ['documentation'], body,
              });
            }

  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run markdown lint
        run: npm run lint
        continue-on-error: true

      - name: Comment on PR if lint fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '## ⚠️ Markdown Lint Failed\n\n' +
              'Please fix markdown formatting issues:\n\n' +
              '```bash\n' +
              'npm run lint:fix\n' +
              '```\n\n' +
              'Then commit the fixes.\n\n' +
              'See the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # The instruments themselves. `check-links` reports on
  # measure-link-reachability.py, and the drain workflow closes issues in bulk —
  # but until 2026-08-29 nothing in CI ran either one's test suite. A check whose
  # instrument is unverified is the same defect this repo keeps documenting: the
  # check fires, so it looks like it works.
  #
  # This job FAILS on a broken instrument, deliberately, with no
  # continue-on-error — a bad instrument invalidates the numbers every other job
  # reports.
  #
  # CORRECTION 2026-08-29: this comment used to say "FAILS the PR", and the
  # workflows README claimed the internal-link check blocks a merge. Neither is
  # true. `master` is unprotected (`protected: false` via the API), so no status
  # check is required and a red job stops nothing — #999 merged while this very
  # job was still running. Failing the job is all this does until someone adds
  # branch protection with `test-instruments` and `check-links` as required
  # checks. Overclaiming a gate is worse than not having one, because it stops
  # anyone from noticing the gate is missing.
  test-instruments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 11 checks incl. determinism across 8 PYTHONHASHSEED values. A `set`
      # literal in the resolver once made this instrument return 168-171 links
      # depending on the hash seed, while the docs called it reproducible.
      - name: Test the reachability instrument
        run: python3 scripts/test-measure-link-reachability.py

      # 16 checks incl. the four unrecoverable ones: never close a human issue,
      # the standing issue, a commented issue, or a PR.
      - name: Test the backlog-drain workflow
        run: node scripts/test-close-superseded-workflow.js

  check-source-accessibility:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract URLs from SOURCES.md
        id: extract-urls
        run: |
          # Extract all URLs from SOURCES.md
          grep -oP 'https?://[^\s)]+' SOURCES.md | sort -u > all_urls.txt

          echo "Extracted $(wc -l < all_urls.txt) unique URLs"

      - name: Check critical Tier A sources
        id: check-tier-a
        run: |
          # Critical Tier A sources that must be accessible
          TIER_A_SOURCES=(
            "https://www.anthropic.com/engineering"
            "https://github.com/anthropics/claude-code"
            "https://docs.anthropic.com"
            "https://agentskills.io"
            "https://github.com/github/spec-kit"
          )

          BROKEN_SOURCES=""

          for url in "${TIER_A_SOURCES[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" --max-time 10)

            if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" -eq 000 ]; then
              echo "❌ CRITICAL: $url returned $HTTP_CODE"
              BROKEN_SOURCES="${BROKEN_SOURCES}- $url (HTTP $HTTP_CODE)\n"
            else
              echo "✅ $url is accessible ($HTTP_CODE)"
            fi
          done

          if [ -n "$BROKEN_SOURCES" ]; then
            echo "has_broken_tier_a=true" >> $GITHUB_OUTPUT
            echo -e "$BROKEN_SOURCES" > broken_tier_a.txt
          else
            echo "has_broken_tier_a=false" >> $GITHUB_OUTPUT
          fi

      - name: Create critical issue for Tier A failures
        if: steps.check-tier-a.outputs.has_broken_tier_a == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const brokenSources = fs.readFileSync('broken_tier_a.txt', 'utf8');

            const body = '## ⚠️ Critical Tier A Sources Are Inaccessible\n\n' +
              'The following primary sources (Evidence Tier A) are currently inaccessible:\n\n' +
              brokenSources + '\n\n' +
              '## Impact\n' +
              'Tier A sources are **primary authoritative sources** including:\n' +
              '- Anthropic official documentation\n' +
              '- Industry standards (GitHub Spec Kit, agentskills.io)\n' +
              '- First-party production data\n\n' +
              '## Immediate Actions Required\n' +
              '- [ ] Verify if sources are temporarily down or permanently moved\n' +
              '- [ ] Check for official announcements about URL changes\n' +
              '- [ ] Update URLs if content moved to new location\n' +
              '- [ ] Use Internet Archive for historical content if removed\n' +
              '- [ ] Consider evidence tier implications if source unavailable\n\n' +
              '## Evidence Tier Implications\n' +
              'If a Tier A source is permanently unavailable:\n' +
              '1. Patterns based solely on that source may need tier downgrade\n' +
              '2. Alternative primary sources should be identified\n' +
              '3. SOURCES.md:1207-1232 should be updated\n\n' +
              '**This is a high-priority issue** - Tier A sources form the foundation of this repository.\n\n' +
              '**Automatically created by link-checker workflow**\n\n' +
              '**Workflow run**: ' + context.payload.repository.html_url + '/actions/runs/' + context.runId;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CRITICAL: Tier A sources inaccessible',
              labels: ['documentation', 'bug', 'critical', 'tier-a'],
              body: body
            });

            console.log('Created critical issue #' + issue.data.number);
