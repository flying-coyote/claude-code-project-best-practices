name: Claude Code
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─── Job 1: PR Review (existing behavior) ─────────────────────────
  claude-review:
    runs-on: ubuntu-latest
    # Gate the `@claude` comment path on the COMMENTER's association.
    #
    # `issue_comment` is NOT a fork-isolated event: it runs on the default branch
    # with the workflow-level permissions and the full secret set. So it has to be
    # gated in `if:`, which the Actions service evaluates from the event payload
    # BEFORE a runner is allocated and before ANTHROPIC_API_KEY reaches any step.
    #
    # Until 2026-08-29 this line read '@.claude' — a typo that meant @claude had
    # NEVER triggered this job via a comment (confirmed in run history: two
    # issue_comment runs fired the workflow and skipped the job). That typo was
    # the repo's only access control on this path, which is why the string fix and
    # this gate had to land in the same commit: correcting the string alone would
    # have exposed a contents:write + id-token:write job holding a live API key to
    # any authenticated GitHub user on a public repo.
    #
    # COLLABORATOR covers any invited collaborator including read-only and triage,
    # so this is slightly broader than "has write access"; claude-code-action
    # separately refuses actors without write access. MEMBER is inert while the
    # owner is a User rather than an Organization, kept as future-proofing.
    # Deliberately NOT CONTRIBUTOR — that only means "has previously committed",
    # which any merged outside PR confers.
    #
    # `pull_request` stays ungated: fork PRs get a read-only token and no secrets.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@v4

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 3: Daily Review URL Checker ───────────────────────────────
  daily-review-check:
    runs-on: ubuntu-latest
    # Comment-only job: its prompt says "Do NOT modify any files. Only post the
    # comment." Prose in a prompt is exactly the control an injected instruction
    # can talk an agent out of, so the token is narrowed to match the intent.
    # (This job is currently dead anyway — nothing has created a `daily-review`
    # labelled issue since source-monitoring.yml was deleted in d9e484d.)
    permissions:
      contents: read
      issues: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      contains(join(github.event.issue.labels.*.name, ','), 'daily-review') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'source-update')
    steps:
      - uses: actions/checkout@v4

      - name: Check Source URLs
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            CONTEXT: You are performing a daily URL health check for the claude-code-project-best-practices repository. Do NOT create PRs or modify any files.

            ISSUE NUMBER: ${{ github.event.issue.number }}

            PROCESS:
            Step 1 — Read SOURCES.md and extract all Tier A source URLs (the "Primary Sources" section).
            Step 2 — For each URL, check HTTP status using: curl -s -o /dev/null -w "%{http_code}" -L "URL" --max-time 10
            Step 3 — Post a comment on issue #${{ github.event.issue.number }} with this format:

            ## Automated URL Health Check

            | Source | URL | Status |
            |--------|-----|--------|
            | [Name] | [URL] | [200 OK / 301 Redirect / 404 Broken / Timeout] |

            ### Summary
            - Checked: [N] Tier A sources
            - Healthy: [N]
            - Needs attention: [N]

            [List any broken sources, or "All sources accessible."]

            ---
            *Automated check by Claude Code Action*

            Do NOT modify any files. Only post the comment.

          claude_args: "--max-turns 15"
